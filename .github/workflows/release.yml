name: Release

on:
  push:
    branches: [develop]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Verify annotated tag, package version, and changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          npm run release:notes -- "$GITHUB_REF_NAME" /tmp/release-notes.md

      - name: Set automatic develop version
        if: github.ref == 'refs/heads/develop'
        shell: bash
        run: npm version --no-git-tag-version "$(node -p "require('./package.json').version.split('-')[0]")-dev.${GITHUB_RUN_NUMBER}"

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Verify application
        run: npm run lint -- --quiet && npm test

  package-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Set automatic develop version
        if: github.ref == 'refs/heads/develop'
        shell: bash
        run: npm version --no-git-tag-version "$(node -p "require('./package.json').version.split('-')[0]")-dev.${GITHUB_RUN_NUMBER}"

      - name: Install dependencies
        run: npm ci

      - name: Prepare application
        run: npm run electron:prepare

      - name: Build Windows x64 installer
        run: npm run release:windows

      - name: Upload release files
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: |
            release/TOEFL-iBT-Practice-*-windows-x64-setup.exe
            release/TOEFL-iBT-Practice-*-windows-x64-setup.exe.blockmap
            release/latest.yml
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  package-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Set automatic develop version
        if: github.ref == 'refs/heads/develop'
        shell: bash
        run: npm version --no-git-tag-version "$(node -p "require('./package.json').version.split('-')[0]")-dev.${GITHUB_RUN_NUMBER}"

      - name: Install dependencies
        run: npm ci

      - name: Prepare application
        run: npm run electron:prepare

      - name: Build Linux x64 AppImage
        run: npm run release:linux

      - name: Upload release files
        uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: |
            release/TOEFL-iBT-Practice-*-linux-x64.AppImage
            release/latest-linux.yml
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  package-macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Set automatic develop version
        if: github.ref == 'refs/heads/develop'
        shell: bash
        run: npm version --no-git-tag-version "$(node -p "require('./package.json').version.split('-')[0]")-dev.${GITHUB_RUN_NUMBER}"

      - name: Install dependencies
        run: npm ci

      - name: Prepare application
        run: npm run electron:prepare

      - name: Build architecture-specific macOS packages
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          configured=0
          for value in "$MAC_CERTIFICATE" "$MAC_CERTIFICATE_PASSWORD" "$MAC_APPLE_ID" "$MAC_APPLE_APP_SPECIFIC_PASSWORD" "$MAC_APPLE_TEAM_ID"; do
            if [[ -n "$value" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "$configured" -ne 0 && "$configured" -ne 5 ]]; then
            echo "Configure all macOS signing secrets or leave all of them empty."
            exit 1
          fi

          if [[ "$configured" -eq 5 ]]; then
            export CSC_LINK="$MAC_CERTIFICATE"
            export CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
            npm run release:macos

            app_count=0
            while IFS= read -r -d '' app_path; do
              codesign --verify --deep --strict --verbose=2 "$app_path"
              app_count=$((app_count + 1))
            done < <(find release -maxdepth 3 -name '*.app' -print0)
            test "$app_count" -eq 2
            for dmg in release/TOEFL-iBT-Practice-*-macos-{x64,arm64}.dmg; do
              xcrun stapler validate "$dmg"
            done
          else
            echo "Building an unsigned macOS package for manual installation."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npm run release:macos
          fi

      - name: Upload release files
        uses: actions/upload-artifact@v6
        with:
          name: release-macos
          path: |
            release/TOEFL-iBT-Practice-*-macos-x64.dmg
            release/TOEFL-iBT-Practice-*-macos-x64.zip
            release/TOEFL-iBT-Practice-*-macos-x64.zip.blockmap
            release/TOEFL-iBT-Practice-*-macos-arm64.dmg
            release/TOEFL-iBT-Practice-*-macos-arm64.zip
            release/TOEFL-iBT-Practice-*-macos-arm64.zip.blockmap
            release/latest-mac.yml
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [package-windows, package-linux, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm

      - name: Set automatic develop version
        if: github.ref == 'refs/heads/develop'
        shell: bash
        run: npm version --no-git-tag-version "$(node -p "require('./package.json').version.split('-')[0]")-dev.${GITHUB_RUN_NUMBER}"

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Validate files and create SHA-256 manifest
        run: npm run release:manifest

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          npm run release:notes --
          "$GITHUB_REF_NAME"
          release-notes.md
          release-files/hashes.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$GITHUB_REF_NAME"
          release_title="$GITHUB_REF_NAME"
          release_flags=(--verify-tag)
          release_notes=(--notes-file release-notes.md)
          if [[ "$GITHUB_REF" == "refs/heads/develop" ]]; then
            version=$(node -p "require('./package.json').version")
            release_tag="v${version}"
            release_title="$release_tag"
            release_flags=(--target "$GITHUB_SHA" --prerelease --fail-on-no-commits)
            release_notes=(--notes "")
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$release_tag" release-files/* \
            --title "$release_title" \
            "${release_notes[@]}" \
            "${release_flags[@]}"
